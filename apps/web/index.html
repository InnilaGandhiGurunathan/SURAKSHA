<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SURAKSHA — Your Safety, Our Priority</title>
    <meta
      name="description"
      content="Offline-first personal safety for solo travellers: journey monitoring, checkpoints, on-device risk heuristics, SOS and incident reporting."
    />
    <meta name="application-name" content="SURAKSHA" />
    <meta name="theme-color" content="#0A1F44" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SURAKSHA" />
    <meta name="format-detection" content="telephone=yes" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="mask-icon" href="/icons/logo.svg" color="#0A1F44" />

    <!-- Boot splash: painted before any JavaScript runs so the first paint is
         branded, then removed by main.tsx once React has mounted. -->
    <style>
      html,
      body {
        margin: 0;
        background: #061530;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 120% at 50% 0%, #0a1f44 0%, #061530 60%, #03101f 100%);
        color: #ffffff;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        transition: opacity 320ms ease;
      }
      #boot-splash .mark {
        width: 88px;
        height: 88px;
        animation: bootPulse 1.8s ease-in-out infinite;
      }
      #boot-splash .word {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.32em;
        padding-left: 0.32em;
      }
      #boot-splash .tag {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #5eead4;
      }
      #boot-splash .bar {
        width: 168px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
      }
      #boot-splash .bar span {
        display: block;
        height: 100%;
        width: 42%;
        border-radius: 999px;
        background: linear-gradient(90deg, #14b8a6, #5eead4);
        animation: bootSlide 1.35s ease-in-out infinite;
      }
      #boot-splash .hint {
        position: absolute;
        bottom: 28px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.55);
        text-align: center;
        padding: 0 24px;
      }
      @keyframes bootPulse {
        0%,
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 0 rgba(20, 184, 166, 0));
        }
        50% {
          transform: scale(1.05);
          filter: drop-shadow(0 6px 22px rgba(20, 184, 166, 0.35));
        }
      }
      @keyframes bootSlide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .mark,
        #boot-splash .bar span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="SURAKSHA is starting">
      <svg class="mark" viewBox="0 0 96 96" aria-hidden="true">
        <defs>
          <linearGradient id="boot-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0A1F44" />
            <stop offset="55%" stop-color="#0D9488" />
            <stop offset="100%" stop-color="#0F766E" />
          </linearGradient>
        </defs>
        <path d="M48 6 14 19v30c0 20.4 14.2 37.7 34 43 19.8-5.3 34-22.6 34-43V19L48 6Z" fill="url(#boot-grad)" />
        <path
          d="M31 48.5 43 60.5 65 38"
          fill="none"
          stroke="#ffffff"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="72" cy="26" r="7" fill="#EF4444" stroke="#ffffff" stroke-width="2.5" />
      </svg>
      <div class="word">SURAKSHA</div>
      <div class="tag">Your Safety, Our Priority</div>
      <div class="bar"><span></span></div>
      <p class="hint">
        Starting your device-local safety data…<br />
        Works offline. SURAKSHA is a safety aid, not an emergency service.
      </p>
    </div>

    <div id="root"></div>
    <noscript>
      <div style="padding: 32px; color: #fff; font-family: system-ui, sans-serif">
        <h1>SURAKSHA needs JavaScript</h1>
        <p>
          The app stores your journeys, checkpoints and reports on your own device, which requires
          JavaScript. Emergency: call your local emergency number.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
